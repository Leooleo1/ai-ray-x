[package]
name = "raiox"
version = "0.1.12"
edition = "2024"
rust-version = "1.88"
description = "Local panel: where your AI coding agents' tokens go, and your own AI inside each project"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = "0.4.45"
clap = { version = "4.6.8", features = ["derive"] }
dirs = "7"
ignore = "0.4.34"
open = "5.4.5"
portable-pty = "0.9.0"
qrcode = { version = "0.15.0", default-features = false, features = ["svg"] }
raiox-core = { version = "0.1.12", path = "../core" }
ring = "0.17.14"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
shell-words = "1.1.1"
similar = "3.2.1"
tiny_http = "0.12.0"

[target."cfg(unix)".dependencies]
libc = "0.2.191"

[target."cfg(windows)".dependencies]
which = "8.0.6"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading"] }
