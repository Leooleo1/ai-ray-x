<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>raiox</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #060607;
        color: #9a9aa6;
        font: 13px/18px ui-monospace, "SF Mono", Menlo, monospace;
      }
      main {
        display: grid;
        height: 100%;
        place-content: center;
        justify-items: center;
        gap: 18px;
        text-align: center;
      }
      svg {
        width: 40px;
        height: 40px;
        fill: #f4f4f6;
        animation: pulso 1.4s ease-in-out infinite;
      }
      @keyframes pulso {
        50% {
          opacity: 0.35;
        }
      }
      #estado {
        max-width: 420px;
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="8" cy="8" r="2.4" /><circle cx="24" cy="8" r="2.4" /><circle cx="12" cy="12" r="2.4" />
        <circle cx="20" cy="12" r="2.4" /><circle cx="16" cy="16" r="2.4" /><circle cx="12" cy="20" r="2.4" />
        <circle cx="20" cy="20" r="2.4" /><circle cx="8" cy="24" r="2.4" /><circle cx="24" cy="24" r="2.4" />
      </svg>
      <span id="estado">abrindo o raiox…</span>
    </main>
  </body>
</html>
