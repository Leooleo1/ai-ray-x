[package]
name = "raiox-core"
version = "0.1.6"
edition = "2024"
rust-version = "1.88"
description = "Reads Claude Code and Codex logs into a local index for raiox"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
dirs = "7.0.0"
memchr = "2.8.3"
rayon = "1.12.0"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"] }
